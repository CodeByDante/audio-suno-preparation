<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Suno Preparation</title><link rel="stylesheet" href="./style.css?v=3"></head>
<body><header><span class="mark" aria-hidden="true">♫</span> Audio Suno Preparation</header>
<main><h1>Editor de audio</h1>
<form class="panel" id="processor">
<div class="editor-header">
<label class="drop"><input id="file" type="file" accept="audio/*,video/mp4,.flac,.wav,.mp3,.mp4" required><span>Elegir archivo</span></label>
<span id="filename">MP3, WAV, FLAC o MP4</span>
</div>
<fieldset id="effects"><legend>Efectos activos</legend>
<label><input type="checkbox" name="effect-pitch" checked> Tono · −12 semitonos</label>
<label><input type="checkbox" name="effect-speed" checked> Velocidad · 0.5×</label>
<label><input type="checkbox" name="effect-band" checked> Filtro · 220–1900 Hz</label>
<label><input type="checkbox" name="effect-eq" checked> Realce · 600 Hz</label>
<label><input type="checkbox" name="effect-reverb" checked> Reverb larga</label>
<label><input type="checkbox" name="effect-hiss" checked> Siseo de vinilo</label>
<label><input type="checkbox" name="effect-crackle" checked> Crujidos y chasquidos</label>
<label><input type="checkbox" name="effect-wow" checked> Fluctuación de vinilo</label>
<label><input type="checkbox" name="effect-limiter" checked> Limitador · −1 dBFS</label>
</fieldset>
<section id="source-preview" aria-label="Pista original">
<div class="timeline">
<canvas id="waveform" aria-hidden="true"></canvas>
<div id="playhead" aria-hidden="true"></div>
<input id="seek" type="range" min="0" max="0" step=".01" value="0" aria-label="Posición en la pista original" disabled>
<span id="empty-wave">Selecciona un archivo para ver su forma de onda</span>
</div>
<div class="transport">
  <button id="play" type="button" aria-label="Reproducir pista original" disabled>▶ <span>Reproducir</span></button>
  <output id="clock" aria-label="Tiempo transcurrido y duración">00:00.0 / 00:00.0</output>
</div>
<audio id="source-player" hidden preload="metadata"></audio>
</section>
<div class="actions"><button id="preset" type="button" disabled>Procesar con valores por defecto ↗</button></div>
<details><summary>Personalizar efectos</summary>
<div class="settings">
<label>Tono (semitonos)<input name="pitch" type="number" min="-24" max="12" step="1" value="-12" required></label>
<label>Velocidad (×)<input name="speed" type="number" min=".25" max="2" step=".01" value=".5" required></label>
<label>Corte inferior (Hz)<input name="low" type="number" min="20" max="18000" step="1" value="220" required></label>
<label>Corte superior (Hz)<input name="high" type="number" min="21" max="20000" step="1" value="1900" required></label>
<label>Centro del realce (Hz)<input name="eq" type="number" min="20" max="20000" step="1" value="600" required></label>
<label>Ganancia del realce (dB)<input name="boost" type="number" min="-18" max="18" step=".1" value="5.5" required></label>
<label>Cola de reverb (s)<input name="decay" type="number" min=".2" max="8" step=".1" value="3.8" required></label>
<label>Mezcla de reverb (%)<input name="wet" type="number" min="0" max="60" step="1" value="22" required></label>
<label>Siseo (%)<input name="hiss" type="number" min="0" max="100" step="1" value="18" required></label>
<label>Crujidos y chasquidos (%)<input name="crackle" type="number" min="0" max="100" step="1" value="22" required></label>
<label>Fluctuación de vinilo (%)<input name="wow" type="number" min="0" max="100" step="1" value="12" required></label>
<label>Techo del limitador (dBFS)<input name="ceiling" type="number" min="-12" max="-.1" step=".1" value="-1" required></label>
</div><button type="submit" id="custom" disabled>Procesar con mis ajustes</button></details>
<div id="progress-box" hidden><progress id="progress" max="1"></progress><button id="cancel" type="button">Cancelar</button></div>
<p id="status" role="status"></p>
<div id="result" hidden><audio id="player" controls preload="metadata"></audio><a id="download" download>Descargar MP3 ↓</a></div>
</form><footer>El audio se procesa en tu navegador y el original se conserva.</footer></main>
<script type="module" src="./app.mjs?v=3"></script></body></html>
